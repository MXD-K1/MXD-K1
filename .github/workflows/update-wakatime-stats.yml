name: Update WakaTime Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  update-readme:
    name: Update WakaTime Stats
    runs-on: ubuntu-latest

    steps:
      - uses: MXD-K1-Forks/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          SHOW_LINES_OF_CODE: "True"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_AI_CODE_TIME: "False"
          MAX_REPOS: 50

          TARGET_FILE: STATS.md
